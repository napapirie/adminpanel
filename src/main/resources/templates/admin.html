<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corporate Service — Admin Panel</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;max-width:1180px;margin:32px auto;padding:0 18px;background:#f3f5f8;color:#111827}header,.card{background:#fff;padding:24px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 10px #0000000d}h1,h2{margin-top:0}a{color:#4338ca}.grid{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%}input,button{padding:9px 10px;border:1px solid #d1d5db;border-radius:7px}button{cursor:pointer}.primary{background:#111827;color:#fff;border-color:#111827}.danger{background:#991b1b;color:#fff;border-color:#991b1b}.secondary{background:#fff}.roles{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}.roles label{white-space:nowrap}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:middle}.name-input{width:100%;min-width:170px}.status{font-size:13px}.muted{color:#6b7280;font-size:14px}.ok{color:#166534}.error{color:#991b1b}.actions{white-space:nowrap}@media(max-width:850px){.grid{grid-template-columns:1fr}.table-wrap{overflow:auto}table{min-width:900px}}
</style>
</head>
<body>
<header>
  <h1>Corporate Service — Admin Panel</h1>
  <p>Управление пользователями и правами доступа.</p>
  <a href="/swagger-ui.html">Swagger API</a> · <a href="/services/users.wsdl">SOAP WSDL</a> · <a href="/logout">Выйти</a>
</header>

<section class="card">
  <h2>Создать пользователя</h2>
  <div class="grid">
    <div class="field"><label for="username">Логин</label><input id="username" placeholder="например, ivan"></div>
    <div class="field"><label for="fullName">Имя</label><input id="fullName" placeholder="Иван Иванов"></div>
    <div class="field"><label for="password">Пароль</label><input id="password" type="password" placeholder="Минимум 6 символов"></div>
  </div>
  <div class="roles">
    <strong>Роли:</strong>
    <label><input type="checkbox" name="newRole" value="USER" checked> USER</label>
    <label><input type="checkbox" name="newRole" value="MANAGER"> MANAGER</label>
    <label><input type="checkbox" name="newRole" value="ADMIN"> ADMIN</label>
  </div>
  <button class="primary" onclick="createUser()">Создать пользователя</button>
  <span id="message" class="muted"></span>
</section>

<section class="card">
  <h2>Пользователи</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>ID</th><th>Логин</th><th>Имя</th><th>Права доступа</th><th>Статус</th><th>Действия</th></tr></thead>
    <tbody>
      <tr th:each="u:${users}" th:id="'row-'+${u.id}">
        <td th:text="${u.id}"></td>
        <td><strong th:text="${u.username}"></strong></td>
        <td><input class="name-input" th:id="'name-'+${u.id}" th:value="${u.fullName}"></td>
        <td>
          <div class="roles" style="margin:0;gap:8px">
            <label><input type="checkbox" th:name="'role-'+${u.id}" value="USER" th:checked="${u.roles.contains(T(com.example.corporate.entity.Role).USER)}"> USER</label>
            <label><input type="checkbox" th:name="'role-'+${u.id}" value="MANAGER" th:checked="${u.roles.contains(T(com.example.corporate.entity.Role).MANAGER)}"> MANAGER</label>
            <label><input type="checkbox" th:name="'role-'+${u.id}" value="ADMIN" th:checked="${u.roles.contains(T(com.example.corporate.entity.Role).ADMIN)}"> ADMIN</label>
          </div>
        </td>
        <td><label class="status"><input type="checkbox" th:id="'enabled-'+${u.id}" th:checked="${u.enabled}"> Активен</label></td>
        <td class="actions"><button class="secondary" th:onclick="'saveUser('+${u.id}+')'">Сохранить</button> <button class="danger" th:onclick="'deleteUser('+${u.id}+')'">Удалить</button></td>
      </tr>
    </tbody>
  </table></div>
  <p class="muted">Пользователю можно назначить сразу несколько ролей. Снятие флажка «Активен» блокирует вход в систему.</p>
</section>
<script>
const api='/api/admin/users';
const msg=document.getElementById('message');
function checkedValues(selector){return [...document.querySelectorAll(selector+':checked')].map(x=>x.value)}
async function request(url,opt){
  const r=await fetch(url,opt);
  if(!r.ok){let e={};try{e=await r.json()}catch(ignore){}throw new Error(e.error||e.message||('HTTP '+r.status))}
  if(r.status===204)return null;
  return r.json();
}
async function createUser(){
  msg.className='muted';msg.textContent='';
  const data={username:document.getElementById('username').value.trim(),password:document.getElementById('password').value,fullName:document.getElementById('fullName').value.trim(),roles:checkedValues('input[name="newRole"]'),enabled:true};
  if(!data.username||!data.password){msg.className='error';msg.textContent=' Укажите логин и пароль.';return}
  if(data.roles.length===0){msg.className='error';msg.textContent=' Выберите хотя бы одну роль.';return}
  try{await request(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});location.reload()}catch(e){msg.className='error';msg.textContent=' '+e.message}
}
async function saveUser(id){
  const roles=checkedValues('input[name="role-'+id+'"]');
  if(roles.length===0){alert('Выберите хотя бы одну роль.');return}
  const data={fullName:document.getElementById('name-'+id).value.trim(),roles:roles,enabled:document.getElementById('enabled-'+id).checked};
  try{await request(api+'/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});alert('Изменения сохранены');location.reload()}catch(e){alert(e.message)}
}
async function deleteUser(id){
  if(!confirm('Удалить пользователя?'))return;
  try{await request(api+'/'+id,{method:'DELETE'});document.getElementById('row-'+id).remove()}catch(e){alert(e.message)}
}
</script>
</body></html>
